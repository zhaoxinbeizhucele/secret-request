# For a host that already terminates HTTPS in Nginx/Caddy.
name: secret-request-public
services:
  relay:
    image: ${SECRET_REQUEST_IMAGE:-ghcr.io/zhaoxinbeizhucele/secret-request:latest}
    restart: unless-stopped
    ports: ['127.0.0.1:${RELAY_PORT:-8787}:8787']
    environment:
      SECRET_REQUEST_BASE_URL: https://${SECRET_REQUEST_DOMAIN:?Set SECRET_REQUEST_DOMAIN in .env}
      # Only the host reverse proxy can reach the loopback published port.
      # It MUST replace X-Forwarded-For with its actual remote client address.
      FORWARDED_ALLOW_IPS: '*'
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 64
    logging:
      options: {max-size: 5m, max-file: '2'}
