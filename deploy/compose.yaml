name: secret-request
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: local/secret-request:0.2.0
    container_name: secret-request-relay
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - ../runtime/relay.json:/run/config/relay.json:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      options: {max-size: "5m", max-file: "2"}

