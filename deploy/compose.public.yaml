name: secret-request-public
services:
  relay:
    image: ${SECRET_REQUEST_IMAGE:-ghcr.io/zhaoxinbeizhucele/secret-request:latest}
    restart: unless-stopped
    environment:
      SECRET_REQUEST_BASE_URL: https://${SECRET_REQUEST_DOMAIN:?Set SECRET_REQUEST_DOMAIN in .env}
      FORWARDED_ALLOW_IPS: '*'
    networks: [relay]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 64
    logging:
      options: {max-size: 5m, max-file: '2'}
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SECRET_REQUEST_DOMAIN: ${SECRET_REQUEST_DOMAIN:?Set SECRET_REQUEST_DOMAIN in .env}
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [relay, edge]
    depends_on:
      relay: {condition: service_healthy}
    mem_limit: 128m
    pids_limit: 128
    logging:
      options: {max-size: 5m, max-file: '2'}
networks:
  relay: {internal: true}
  edge: {}
volumes:
  caddy-data: {}
  caddy-config: {}
