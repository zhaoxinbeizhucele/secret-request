<!doctype html>
<!-- DIRECTION CONTRACT: operate; a recipient responds to a short-lived agent request.
WORLD: a crisp centered auth-style card; cool neutrals, hairline borders, soft layered shadow, one indigo accent; no decorative assets.
FIRST VIEWPORT: request name, declared agent, purpose and deadline above labelled fields.
FORM: one request, submit or decline; entry links carry per-request permission. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>机密输入请求</title>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <main>
    <header class="card-head"><div class="theme-switch" role="radiogroup" aria-label="界面主题"><button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-choice="light" aria-label="亮色" title="亮色"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg></button><button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-choice="dark" aria-label="暗色" title="暗色"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 9.6A5.5 5.5 0 0 1 6.4 2.5a5.5 5.5 0 1 0 7.1 7.1z"/></svg></button><button type="button" role="radio" aria-checked="true" tabindex="0" data-theme-choice="system" aria-label="跟随系统" title="跟随系统"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.75" y="2.5" width="12.5" height="8.5" rx="1.5"/><path d="M5.5 14h5M8 11v3"/></svg></button></div><svg class="mark" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6"/><path d="M12 7.5a2.5 2.5 0 0 1 1.2 4.7l.8 4.3h-4l.8-4.3A2.5 2.5 0 0 1 12 7.5z"/></svg></header>
    <h1 id="title">机密输入请求</h1>
    <p id="status" role="status" aria-live="polite">正在检查请求…</p>
    <section id="request" hidden aria-label="请求详情">
      <dl>
        <div><dt>申请 Agent</dt><dd id="agent"></dd></div>
        <div><dt>申请时间</dt><dd id="created"></dd></div>
        <div><dt>本次用途</dt><dd id="purpose"></dd></div>
        <div><dt>剩余时间</dt><dd id="remaining"></dd></div>
      </dl>
      <form id="form" hidden novalidate>
        <div id="fields"></div>
        <div id="legacy-field">
        <label id="secret-label" for="secret">输入本次提供的机密</label>
        <div class="input-wrap">
          <input id="secret" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="65536" aria-describedby="hint">
          <button type="button" id="visibility" class="quiet" aria-pressed="false">显示</button>
        </div>
        <textarea id="multiline-secret" hidden rows="5" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="65536" aria-label="多行机密内容" aria-describedby="hint"></textarea>
        <label class="check"><input id="multiline" type="checkbox">多行内容（明文显示）</label>
        </div>
        <p id="hint" class="secondary">只用于这次请求。提交后会清空输入框。</p>
        <p id="error" role="alert" hidden></p>
        <div class="actions">
          <button id="submit" type="submit">提交本次机密</button>
          <button id="decline" type="button" class="secondary-button">拒绝请求</button>
        </div>
      </form>
      <p id="close-hint" hidden role="status">已提交并清空输入。若浏览器未自动关闭，请关闭此标签页。</p>
    </section>
  </main>
  <p class="footer"><span class="lock" aria-hidden="true"></span>由你选择并提供机密，无需连接密码管理器。</p>
</body>
</html>
