[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-request"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.38.0", "httpx==0.28.1", "cryptography==46.0.3"]

[project.scripts]
secret-request = "secret_request.client:main"

[tool.setuptools.packages.find]
include = ["secret_request*"]

[tool.setuptools.package-data]
secret_request = ["web/*", "native/windows/*.exe", "native/macos/SecretRequestNotify.app/Contents/*", "native/macos/SecretRequestNotify.app/Contents/MacOS/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
